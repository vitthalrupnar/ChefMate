<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChefMate</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <div class="left-side">
        <div class="logo">
          <img src="./5526265-removebg-preview.png" alt="" />
          <a class="chefmate" href="index.html">ChefMate</a>
        </div>
      </div>
      <div class="right-side">
        <div class="home hover-border-bottom">
          <a href="index.html">Home</a>
        </div>
        <div class="search-food">
          <input
            class="search-input"
            type="text"
            name=""
            id=""
            placeholder="Search Recipe here....."
          />
          <p class="search">Search</p>
        </div>
        <div class="help hover-border-bottom">
          <a href="./help.html">Help & Support</a>
        </div>
        <div class="cart hover-border-bottom">
          <i class="bi bi-bag-dash" onclick="cartPageOpen()"></i>
        </div>
      </div>
      <i class="hamburger bi bi-list"></i>
    </nav>

    <di v class="recipes-container"> </di>

    <footer class="footer">
      <div class="footer-content">
        <h3>ChefMate</h3>
        <p>Discover and share your favorite recipes!</p>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2025 Recipe World. All Rights Reserved.</p>
      </div>
    </footer>

    <script type="module" src="script.js"></script>
  </body>
</html>
