<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <title>ChefMate</title>
</head>
<body>

  <nav>
    <div class="left-side">
      <div class="logo">
        <img src="./5526265-removebg-preview.png" alt="logo" />
        <a class="chefmate" href="index.html">ChefMate</a>
      </div>
      <button class="hamburger" aria-expanded="false" aria-label="Toggle menu">
        <i class="bi bi-list"></i>
      </button>
    </div>

    <div class="search-bar-wrapper">
      <div class="search-food">
        <input class="search-input" type="text" placeholder="Search recipes, ingredients..." />
        <button class="search-btn" aria-label="Search">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </div>

    <div class="right-side">
      <div class="home hover-border-bottom"><a href="index.html">Home</a></div>
      <div class="help hover-border-bottom"><a href="./about.html">About</a></div>
      <div class="help hover-border-bottom"><a href="./help.html">Help & Support</a></div>
      <div class="help hover-border-bottom"><a href="./contact.html">Contact Us</a></div>
      <div class="cart hover-border-bottom"><i class="bi bi-bag-dash" onclick="cartPageOpen()"></i></div>
    </div>
  </nav>

  <!-- Recipes section -->
  <div class="recipes-container"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <h3>ChefMate</h3>
      <p>Discover and share your favorite recipes!</p>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2025 Recipe World. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
