<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart ChefMate</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="cart.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="left-side">
        <div class="logo">
          <img src="./5526265-removebg-preview.png" alt="" />
          <a class="chefmate" href="index.html">ChefMate</a>
        </div>
      </div>
      <div class="right-side">
        <div class="home hover-border-bottom">
          <a href="index.html">Home</a>
        </div>
        <div class="help hover-border-bottom">
          <a href="./about.html">About</a>
        </div>
        <div class="help hover-border-bottom">
          <a href="./help.html">Help & Support</a>
        </div>
        <div class="help hover-border-bottom">
          <a href="./contact.html">Contact Us</a>
        </div>
        <div class="cart hover-border-bottom">
          <i class="bi bi-bag-dash" onclick="cartPageOpen()"></i>
        </div>
      </div>
    </nav>

    <!-- Cart Section -->
    <div class="cart-container">
      <div class="cart-content"></div>
      <div class="cart-summary">
        <h3>Cart Summary</h3>
        <p class="cart-count">Items: 0</p>
        <p class="total-price">Total: ₹0</p>
        <button class="place-order-btn">Place Order</button>
      </div>
    </div>

    <!-- Order Form Modal -->
    <div class="order-modal hidden">
      <div class="order-form">
        <h2>Enter Delivery Details</h2>
        <input type="text" id="name" placeholder="Full Name" required />
        <input type="text" id="address" placeholder="Delivery Address" required />
        <input type="tel" id="phone" placeholder="Phone Number" required />
        <button onclick="confirmOrder()">Confirm Order</button>
        <button onclick="closeModal()" class="close-btn">Cancel</button>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-content">
        <h3>ChefMate</h3>
        <p>Discover and share your favorite recipes!</p>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2025 Recipe World. All Rights Reserved.</p>
      </div>
    </footer>

    <script src="./cart.js"></script>
  </body>
</html>
